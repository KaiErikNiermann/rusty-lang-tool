# Dependency bumps. Cargo has two workspaces (the main one + the detached fuzz crate); the L4 training
# pipeline is a uv/Python project; plus the Actions themselves. Grouped to keep PR noise down — the CI
# (ci.yml) runs the full test/clippy/wasm gate on each bump, and nightly.yml adds miri/fuzz/oracle.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, rust]

  - package-ecosystem: cargo
    directory: "/fuzz" # detached workspace (libfuzzer-sys / arbitrary)
    schedule:
      interval: weekly
      day: monday
    groups:
      fuzz-deps:
        patterns: ["*"]
    labels: [dependencies, fuzz]

  - package-ecosystem: pip
    directory: "/pipeline" # uv project (pyproject.toml) — the offline L4 train/quantize pipeline
    # GHSA-4j2p-28q2-5m79 (accelerate path traversal) is dismissed as not-used, not fixed: no
    # patched release exists — 1.15.0, the latest, still does the unsanitized
    # `os.path.join(checkpoint_folder, f)` over weight_map entries, so the advisory's "<= 1.14.0"
    # range is stale rather than resolved. It does not reach us: accelerate is transitive via
    # `gector`, and the vulnerable entrypoints (load_checkpoint_in_model /
    # load_checkpoint_and_dispatch) are only taken through the big-model loader, which needs
    # device_map / offload / low_cpu_mem_usage — none of which this pipeline ever sets. The only
    # checkpoint it loads is the hardcoded $RLT_MODEL_ID default, and the pipeline is offline and
    # developer-run: not in CI, not a dependency of any shipped crate, absent from the wasm/web
    # build. Revisit if a release lands that sanitizes those entries, or if device_map is adopted.
    schedule:
      interval: weekly
      day: monday
    groups:
      pipeline-deps:
        patterns: ["*"]
    labels: [dependencies, python]

  - package-ecosystem: npm
    directory: "/web" # the SvelteKit demo (pnpm) — Monaco, Svelte, Vite, et al.
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, web]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
